name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out tap
        uses: actions/checkout@v7

      - name: Add Homebrew to PATH
        if: runner.os == 'Linux'
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "$HOMEBREW_PREFIX/bin" >> "$GITHUB_PATH"
          echo "$HOMEBREW_PREFIX/sbin" >> "$GITHUB_PATH"

      - name: Tap repository
        run: brew tap aproint/tap "$GITHUB_WORKSPACE"

      - name: Audit formula
        run: brew audit --strict --online aproint/tap/copilot-cli

      - name: Install formula
        run: brew install aproint/tap/copilot-cli

      - name: Test formula
        run: brew test aproint/tap/copilot-cli
